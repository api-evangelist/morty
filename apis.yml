aid: morty
name: Morty
description: >-
  Morty is a digital mortgage platform and modular, embeddable mortgage
  infrastructure company (a Techstars-backed fintech). It gives loan officers,
  brokers, realtors, and fintech partners an all-in-one, compliance-ready stack
  to launch and scale a mortgage business without building from scratch: a Loan
  Origination System (LOS), Point-of-Sale (POS), a real-time Product & Pricing
  Engine (PPE), a lender network (25+ lenders), processing and fulfillment, and
  Rosey AI automation. Partners can embed mortgage into their own product via
  Morty's embeddable widgets and "real-time pricing, eligibility, and overlays
  via API," with an API key provisioned through a partnership (Contact Sales).
  Morty publishes no public OpenAPI, developer portal, or /.well-known API
  surface today — the API is partner-gated.
